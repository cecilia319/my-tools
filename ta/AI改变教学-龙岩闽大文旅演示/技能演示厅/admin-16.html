var g = document.getElementById('grid');
SKILLS.forEach(function(s, i){
  var d = document.createElement('div');
  d.className = 'card';
  d.innerHTML = '<span class="no">' + (i+1 < 10 ? '0'+(i+1) : i+1) + '</span><span class="t">' + s.t + '</span><div class="d">' + s.d + '</div>';
  d.onclick = function(){ openM(i); };
  g.appendChild(d);
});
function openM(i){
  cur = SKILLS[i];
  document.getElementById('mtitle').textContent = (i+1 < 10 ? '0'+(i+1) : i+1) + ' · ' + cur.t;
  document.getElementById('mscene').innerHTML = '<b>场景：</b>' + cur.scene;
  document.getElementById('min').textContent = cur.input;
  document.getElementById('mout').textContent = '等待运行…';
  document.getElementById('modal').classList.add('on');
}
function closeM(){ document.getElementById('modal').classList.remove('on'); }
function run(){
  var el = document.getElementById('mout');
  el.textContent = '';
  var i = 0, step = 8, plain = cur.out;
  clearInterval(el._t);
  el._t = setInterval(function(){
    i += step;
    if(i >= plain.length){ el.textContent = plain; clearInterval(el._t); return; }
    el.textContent = plain.slice(0, i) + '▌';
  }, 12);
}
document.getElementById('modal').addEventListener('click', function(e){ if(e.target === this) closeM(); });
</script>
</body>
</html>
