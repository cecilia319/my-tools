<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>股票助手工作台 · 会成长的炒股决策台</title>
<style>
:root {
  --bg: #0a0d14; --panel: #10141d; --panel2: #161b26; --panel3: #1b2130;
  --border: #1f2736; --border2: #2a3448;
  --text: #dce3f2; --muted: #7d8aa5; --faint: #55607a;
  --accent: #f2b63d; --accent-dim: rgba(242,182,61,.14);
  --up: #f6465d; --up-dim: rgba(246,70,93,.13);
  --down: #2ebd85; --down-dim: rgba(46,189,133,.13);
  --blue: #4f8ef7; --blue-dim: rgba(79,142,247,.13);
  --radius: 10px;
  font-size: 14px;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
  background: var(--bg); color: var(--text);
  font-family: "Segoe UI","Microsoft YaHei","PingFang SC",system-ui,sans-serif;
  min-width: 1080px;
}
::-webkit-scrollbar { width:8px; height:8px; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius:4px; }
::-webkit-scrollbar-track { background: transparent; }

/* ============ 侧边导航 ============ */
.sidebar {
  position: fixed; left:0; top:0; bottom:0; width: 232px;
  background: linear-gradient(180deg, #0d1119 0%, #0a0d14 100%);
  border-right: 1px solid var(--border);
  display:flex; flex-direction:column; padding: 20px 0 12px; z-index: 10;
}
.brand { padding: 4px 20px 16px; border-bottom: 1px solid var(--border); }
.brand h1 { font-size: 19px; letter-spacing: 1px; color: var(--text); }
.brand h1 b { color: var(--accent); font-weight: 700; }
.brand p { font-size: 11.5px; color: var(--muted); margin-top: 5px; line-height: 1.5; }
.nav { flex: 1; padding: 14px 12px; overflow-y: auto; }
.nav-group { font-size: 10.5px; color: var(--faint); letter-spacing: 2px; padding: 12px 10px 6px; }
.side-item {
  display:flex; align-items:center; gap:10px; padding: 9px 12px; margin: 2px 0;
  border-radius: 8px; cursor: pointer; color: var(--muted); font-size: 13.5px;
  transition: all .15s; border: 1px solid transparent; user-select: none;
}
.side-item:hover { background: var(--panel2); color: var(--text); }
.side-item.active { background: var(--accent-dim); color: var(--accent); border-color: rgba(242,182,61,.25); font-weight: 600; }
.side-item .ico { width: 18px; text-align:center; font-size: 14px; flex-shrink:0; }
.badge {
  margin-left:auto; font-size: 10.5px; padding: 1px 7px; border-radius: 10px;
  background: var(--panel3); color: var(--muted); border: 1px solid var(--border2);
}
.badge.hot { background: var(--up-dim); color: var(--up); border-color: rgba(246,70,93,.3); }
.badge.amber { background: var(--accent-dim); color: var(--accent); border-color: rgba(242,182,61,.3); }
.side-foot { padding: 10px 20px; font-size: 10.5px; color: var(--faint); border-top: 1px solid var(--border); line-height: 1.7; }

/* ============ 主区 ============ */
.main { margin-left: 232px; padding: 26px 30px 50px; }
.page { display: none; animation: fade .25s; }
.page.active { display: block; }
@keyframes fade { from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;} }
.page-head { display:flex; align-items: baseline; gap: 14px; margin-bottom: 4px; }
.page-head h2 { font-size: 21px; letter-spacing: .5px; }
.page-head .en { font-size: 11px; color: var(--faint); letter-spacing: 3px; text-transform: uppercase; }
.page-sub { color: var(--muted); font-size: 12.5px; margin: 6px 0 20px; line-height: 1.6; }

/* 通用卡片 */
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.card h3 { font-size: 14px; margin-bottom: 12px; display:flex; align-items:center; gap:8px; }
.card h3 .dot { width:7px; height:7px; border-radius:50%; background: var(--accent); }
.grid { display:grid; gap: 14px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }

/* 统计卡 */
.stat { background: var(--panel); border:1px solid var(--border); border-radius: var(--radius); padding: 15px 18px 13px; }
.stat .lb { font-size: 12px; color: var(--muted); display:flex; justify-content: space-between; align-items:center;}
.stat .val { font-size: 27px; font-weight: 700; margin: 6px 0 2px; font-variant-numeric: tabular-nums; }
.stat .sub { font-size: 11.5px; color: var(--faint); }
.stat .val.up { color: var(--up); } .stat .val.down { color: var(--down); }
.stat .val.amber { color: var(--accent); } .stat .val.blue { color: var(--blue); }

/* 管线(助手在做什么) */
.pipeline { display:flex; align-items:stretch; gap:0; overflow-x:auto; padding: 4px 0 2px; }
.pl-step { flex:1; min-width: 118px; position: relative; padding: 10px 14px 10px 26px;
  background: var(--panel); border: 1px solid var(--border); border-right: none; }
.pl-step:last-child { border-right: 1px solid var(--border); border-radius: 0 var(--radius) var(--radius) 0; }
.pl-step:first-child { border-radius: var(--radius) 0 0 var(--radius); }
.pl-step::before { content:"✓"; position:absolute; left: 9px; top: 12px; color: var(--down); font-size: 11px; font-weight:700; }
.pl-step .t { font-size: 12.5px; font-weight: 600; }
.pl-step .tm { font-size: 10.5px; color: var(--accent); margin-top: 2px; font-variant-numeric: tabular-nums; }
.pl-step .d { font-size: 10.5px; color: var(--faint); margin-top: 3px; line-height: 1.4; }

/* 信号卡 */
.sig-card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); padding: 15px 17px; position: relative; overflow: hidden; }
.sig-card::before { content:""; position:absolute; left:0; top:0; bottom:0; width:3px; }
.sig-card.lv-high::before { background: var(--accent); }
.sig-card.lv-mid::before { background: var(--blue); }
.sig-card.lv-watch::before { background: var(--faint); }
.sig-top { display:flex; align-items:center; gap: 13px; }
.ring { width: 56px; height:56px; border-radius:50%; flex-shrink:0;
  display:flex; align-items:center; justify-content:center; flex-direction:column;
  border: 2.5px solid; background: var(--panel2); }
.ring .sc { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
.ring .lb { font-size: 8.5px; color: var(--faint); letter-spacing:1px; }
.ring.lv-high { border-color: var(--accent); } .ring.lv-high .sc { color: var(--accent); }
.ring.lv-mid { border-color: var(--blue); } .ring.lv-mid .sc { color: var(--blue); }
.ring.lv-watch { border-color: var(--faint); } .ring.lv-watch .sc { color: var(--muted); }
.sig-name { flex: 1; }
.sig-name .nm { font-size: 16.5px; font-weight: 700; }
.sig-name .nm .cd { font-size: 11.5px; color: var(--faint); font-weight: 400; margin-left: 7px; font-variant-numeric: tabular-nums; }
.sig-name .gt { font-size: 11.5px; color: var(--muted); margin-top: 3px; }
.rule-tag { font-size: 11px; padding: 3px 9px; border-radius: 6px; background: var(--panel3); border:1px solid var(--border2); color: var(--muted); display:inline-block; margin-top: 5px; }
.rule-tag.gold { color: var(--accent); border-color: rgba(242,182,61,.35); background: var(--accent-dim); }
.sig-detail { font-size: 12px; color: var(--muted); margin: 10px 0; line-height: 1.55; }
.px-grid { display:grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 10px 0 4px; }
.px { background: var(--panel2); border:1px solid var(--border); border-radius: 8px; padding: 7px 10px; }
.px .l { font-size: 10.5px; color: var(--faint); }
.px .v { font-size: 15px; font-weight: 700; margin-top: 1px; font-variant-numeric: tabular-nums; }
.px .s { font-size: 10.5px; }
.px.now .v { color: var(--text); } .px.stop .v { color: var(--down); } .px.tgt .v { color: var(--up); }
.chips { display:flex; flex-wrap: wrap; gap: 6px; margin-top: 9px; }
.chip { font-size: 10.8px; padding: 2.5px 9px; border-radius: 12px; border:1px solid var(--border2); color: var(--muted); background: var(--panel2); }
.chip.hot { color: var(--accent); border-color: rgba(242,182,61,.3); background: var(--accent-dim); }
.chip.risk { color: var(--up); border-color: rgba(246,70,93,.35); background: var(--up-dim); }
.chip.ok { color: var(--down); border-color: rgba(46,189,133,.3); background: var(--down-dim); }
.ban { position:absolute; top: 13px; right: 14px; font-size: 10.5px; color: var(--up);
  border: 1px solid rgba(246,70,93,.4); background: var(--up-dim); padding: 2.5px 9px; border-radius: 6px; letter-spacing: 1px; }

/* 表格 */
table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
th { text-align: left; color: var(--faint); font-weight: 600; font-size: 11.5px; padding: 8px 10px; border-bottom: 1px solid var(--border2); white-space: nowrap; }
td { padding: 8px 10px; border-bottom: 1px solid var(--border); color: var(--text); white-space: nowrap; }
tr:hover td { background: var(--panel2); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.tbl-wrap { max-height: 520px; overflow-y: auto; border: 1px solid var(--border); border-radius: var(--radius); background: var(--panel); }
.p-up { color: var(--up); } .p-down { color: var(--down); } .p-flat { color: var(--muted); }

/* 板块资金条 */
.flow-row { display:grid; grid-template-columns: 150px 1fr 92px 64px; align-items:center; gap: 10px; padding: 6.5px 4px; border-bottom: 1px solid var(--border); font-size: 12.5px; }
.flow-row:last-child { border-bottom: none; }
.flow-row .fn { color: var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.flow-bar { height: 9px; border-radius: 5px; background: var(--panel3); overflow:hidden; position: relative; }
.flow-bar i { position:absolute; top:0; bottom:0; border-radius:5px; }
.flow-bar i.in { background: linear-gradient(90deg, #b03048, var(--up)); left:0; }
.flow-bar i.out { background: linear-gradient(90deg, var(--down), #1d7a58); right:0; }
.flow-row .fv { text-align:right; font-variant-numeric: tabular-nums; }

/* 分组卡片 */
.grp { background: var(--panel); border:1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; cursor:pointer; transition: all .15s; }
.grp:hover { border-color: var(--accent); }
.grp.sel { border-color: var(--accent); background: var(--accent-dim); }
.grp .n { font-size: 13.5px; font-weight: 600; display:flex; justify-content: space-between; align-items:center;}
.grp .n .cnt { font-size: 10.5px; color: var(--faint); font-weight: 400; }
.grp .m { font-size: 11.5px; margin-top: 5px; color: var(--muted); }
.grp .m b { font-variant-numeric: tabular-nums; }

/* 解禁 */
.un-card { background: var(--panel); border:1px solid var(--border); border-radius: var(--radius); padding: 13px 15px; }
.un-card .h { display:flex; justify-content: space-between; align-items: baseline; }
.un-card .h .n { font-size: 15px; font-weight: 700; }
.un-card .h .n .cd { font-size: 11px; color: var(--faint); font-weight:400; margin-left: 6px;}
.un-row { display:flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px dashed var(--border); font-size: 12.5px; }
.un-row:last-child { border-bottom:none; }
.un-row .d { color: var(--text); font-variant-numeric: tabular-nums; }
.un-row .r { color: var(--muted); }
.tag-danger { color: var(--up); font-weight: 700; }
.tag-warn { color: var(--accent); font-weight: 600; }
.cal-row { display:flex; align-items:flex-end; gap: 3px; height: 110px; padding: 10px 4px 0; }
.cal-col { flex:1; display:flex; flex-direction:column; align-items:center; gap: 4px; min-width: 0; }
.cal-col .b { width: 100%; background: linear-gradient(180deg, #b03048, #7a2033); border-radius: 3px 3px 0 0; }
.cal-col .dl { font-size: 9px; color: var(--faint); transform: rotate(-45deg) translate(-4px,-2px); white-space:nowrap; }
.cal-col .ct { font-size: 9.5px; color: var(--muted); }

/* 胜率种子 */
.seed-row { display:grid; grid-template-columns: 88px 1fr 52px; align-items:center; gap: 10px; padding: 5.5px 0; font-size: 12.5px; }
.seed-bar { height: 12px; background: var(--panel3); border-radius: 3px; overflow:hidden; }
.seed-bar i { display:block; height: 100%; background: linear-gradient(90deg, #8a6420, var(--accent)); border-radius: 3px; }

/* 学习笔记 */
.md-box { background: var(--panel2); border:1px solid var(--border); border-radius: 8px; padding: 13px 15px;
  font-size: 12.5px; color: var(--muted); line-height: 1.8; white-space: pre-wrap; max-height: 300px; overflow-y: auto; }
.md-box b, .md-box strong { color: var(--text); }

/* 待办 */
.todo-item { display:flex; gap: 12px; padding: 10px 0; border-bottom: 1px dashed var(--border); font-size: 13px; align-items: flex-start; }
.todo-item:last-child { border-bottom: none; }
.todo-item .no { width: 22px; height:22px; border-radius: 50%; background: var(--accent-dim); color: var(--accent);
  display:flex; align-items:center; justify-content:center; font-size: 11.5px; font-weight: 700; flex-shrink:0; margin-top: 1px;}
.todo-item .bd .t { font-weight: 600; }
.todo-item .bd .d { font-size: 11.8px; color: var(--muted); margin-top: 3px; line-height: 1.55; }

code.k { background: var(--panel3); border: 1px solid var(--border2); padding: 1px 6px; border-radius: 5px; font-size: 11.5px; color: var(--accent); font-family: Consolas, monospace; }
.hint { font-size: 11.5px; color: var(--faint); line-height: 1.7; margin-top: 10px; }
.empty { text-align:center; padding: 42px 20px; color: var(--faint); font-size: 13px; line-height: 2.1; }
.empty .big { font-size: 30px; display:block; margin-bottom: 8px; }
.divider { height: 1px; background: var(--border); margin: 20px 0; }
.mt14 { margin-top: 14px; } .mt20 { margin-top: 20px; }
.two-col { display:grid; grid-template-columns: 1.25fr 1fr; gap: 14px; }
</style>
</head>
<body>

<aside class="sidebar">
  <div class="brand">
    <h1>股票<b>助手</b></h1>
    <p>会成长的炒股决策台<br>规则扫描 × 多因子 × 每周进化</p>
  </div>
  <nav class="nav" id="nav"></nav>
  <div class="side-foot" id="sideFoot"></div>
</aside>

<main class="main">
  <section class="page active" id="page-overview"></section>
  <section class="page" id="page-signals"></section>
  <section class="page" id="page-holdings"></section>
  <section class="page" id="page-market"></section>
  <section class="page" id="page-unlock"></section>
  <section class="page" id="page-pool"></section>
  <section class="page" id="page-brain"></section>
  <section class="page" id="page-guide"></section>
</main>

<script src="data.js"></script>
<script>
/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = t => String(t == null ? '' : t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const D = WB_DATA;
const pctCls = p => p > 0 ? 'p-up' : (p < 0 ? 'p-down' : 'p-flat');
const pctTxt = p => (p == null ? '--' : (p > 0 ? '+' : '') + p.toFixed(2) + '%');
const priceTxt = p => p == null ? '--' : p.toFixed(2);
const fmtYi = v => (v == null ? '--' : (v >= 0 ? '+' : '') + v.toFixed(1) + '亿');
const lvOf = s => s.score >= 75 ? 'high' : (s.score >= 55 ? 'mid' : 'watch');
const LV_TXT = { high: '高置信', mid: '中置信', watch: '观察区' };

/* ================= 导航 ================= */
const NAV = [
  { id:'overview', ico:'📊', txt:'总览',          grp:'决策台' },
  { id:'signals',  ico:'🎯', txt:'今日信号',      grp:'决策台', badge: () => D.summary.mid + D.summary.high },
  { id:'holdings', ico:'💼', txt:'持仓跟踪',      grp:'决策台', badge: () => D.summary.holdings_count },
  { id:'market',   ico:'💓', txt:'市场脉搏',      grp:'情报区' },
  { id:'unlock',   ico:'🚨', txt:'解禁雷达',      grp:'情报区', badge: () => new Set((D.unlock.pool_hits||[]).map(u => u.code)).size, hot: () => (D.unlock.pool_hits||[]).length > 0 },
  { id:'pool',     ico:'🗂️', txt:'股票池',        grp:'情报区', badge: () => D.summary.pool_count },
  { id:'brain',    ico:'🧠', txt:'学习与进化',    grp:'助手大脑' },
  { id:'guide',    ico:'📖', txt:'使用说明',      grp:'助手大脑' },
];
function renderNav() {
  let html = '', lastGrp = '';
  NAV.forEach(n => {
    if (n.grp !== lastGrp) { html += `<div class="nav-group">${n.grp}</div>`; lastGrp = n.grp; }
    let bd = '';
    if (n.badge) { const v = n.badge(); if (v > 0) bd = `<span class="badge ${n.hot && n.hot() ? 'hot' : ''}">${v}</span>`; }
    html += `<div class="side-item ${n.id==='overview'?'active':''}" data-page="${n.id}"><span class="ico">${n.ico}</span>${n.txt}${bd}</div>`;
  });
  $('#nav').innerHTML = html;
  document.querySelectorAll('.side-item').forEach(el => el.onclick = () => {
    document.querySelectorAll('.side-item').forEach(x => x.classList.remove('active'));
    document.querySelectorAll('.page').forEach(x => x.classList.remove('active'));
    el.classList.add('active');
    $('#page-' + el.dataset.page).classList.add('active');
  });
  $('#sideFoot').innerHTML = `数据快照 ${esc(D.meta.date)}<br>下次自动运行 15:20`;
}

/* ================= 信号卡 ================= */
function sigCard(s) {
  const lv = lvOf(s);
  const risks = (s.risks || []).map(r => `<span class="chip risk">⚠ ${esc(r)}</span>`).join('');
  const hotc = (s.hot_hits || []).map(h => `<span class="chip hot">🔥 ${esc(h)}</span>`).join('');
  const okc = s.risks && s.risks.length === 0 ? `<span class="chip ok">✓ 无风险标记</span>` : '';
  const un = s.unlock ? `<span class="chip risk">🚨 30天内解禁 ${esc(s.unlock.date)} (${esc(s.unlock.ratio_pct)}%)</span>` : '';
  const ban = lv === 'watch' ? `<div class="ban">⛔ 禁买</div>` : '';
  const styleName = (D.brain.styles[s.style] || {}).name || s.style;
  return `<div class="sig-card lv-${lv}">
    ${ban}
    <div class="sig-top">
      <div class="ring lv-${lv}"><span class="sc">${s.score.toFixed(1)}</span><span class="lb">SCORE</span></div>
      <div class="sig-name">
        <div class="nm">${esc(s.name)}<span class="cd">${esc(s.code)}</span></div>
        <div class="gt">${esc(s.group)} · ${esc(s.theme)}</div>
        <span class="rule-tag ${s.rule==='shrink_pullback'?'gold':''}">${esc((D.brain.rules[s.rule]||{}).desc || s.rule)} · ${esc(styleName)}</span>
      </div>
    </div>
    <div class="sig-detail">${esc(s.detail)}</div>
    <div class="px-grid">
      <div class="px now"><div class="l">现价(信号基准)</div><div class="v">${priceTxt(s.price)}</div><div class="s ${pctCls(s.pct_today)}">${pctTxt(s.pct_today)}</div></div>
      <div class="px stop"><div class="l">止损价(纪律)</div><div class="v">${priceTxt(s.stop_price)}</div><div class="s">${s.stop_pct}% · 破线必走</div></div>
      <div class="px tgt"><div class="l">目标价</div><div class="v">${priceTxt(s.target_price)}</div><div class="s">+${s.target_pct}% · 到位分批止盈</div></div>
    </div>
    <div class="chips">${hotc}${un}${risks}${okc}<span class="chip">行业胜率种子 ${(s.winrate_seed*100).toFixed(1)}%</span></div>
  </div>`;
}

/* ================= 总览 ================= */
function renderOverview() {
  const sm = D.summary;
  const top = (D.signals.high.concat(D.signals.mid)).slice(0, 3);
  const hotArr = Object.entries(D.signals.hot_sectors || {}).slice(0, 10);
  const lu = D.market.limitup;
  const todoHtml = `
    <div class="card mt14">
      <h3><span class="dot"></span>今日你要做的</h3>
      ${D.summary.holdings_count === 0 ? `<div class="todo-item"><span class="no">1</span><div class="bd"><div class="t">填写持仓 <code class="k">config/holdings.json</code></div><div class="d">把当前持仓(代码/成本价/股数/风格)填进去, 助手才会每天帮你盯止损止盈。空仓可跳过。</div></div></div>` : ''}
      <div class="todo-item"><span class="no">${D.summary.holdings_count === 0 ? 2 : 1}</span><div class="bd"><div class="t">看「今日信号」决定是否出手</div><div class="d">重点看中/高置信信号: 现价附近买、跌到止损价必须卖、到目标价分批止盈。观察区信号是形态到了但被防狼原则拦截, 禁买。</div></div></div>

function flowTable(list, label) {
  const maxAbs = Math.max(0.01, ...list.map(i => Math.abs(i.net_yi || 0)));
  return `<div class="card"><h3><span class="dot"></span>${label}</h3>` +
    list.map(i => {
      const w = Math.max(1.5, Math.abs(i.net_yi || 0) / maxAbs * 100);
      const inCls = (i.net_yi || 0) >= 0;
      return `<div class="flow-row"><span class="fn">${esc(i.name)}</span>
        <div class="flow-bar"><i class="${inCls ? 'in' : 'out'}" style="width:${w}%"></i></div>
        <span class="fv ${inCls ? 'p-up' : 'p-down'}">${fmtYi(i.net_yi)}</span>
        <span class="fv ${pctCls(i.pct)}">${pctTxt(i.pct)}</span></div>`;
    }).join('') + `</div>`;
}

      <div class="stat"><div class="lb">待验证(open)</div><div class="val">${b.log_stats.open}</div><div class="sub">5日/20日后自动回看结果</div></div>
      <div class="stat"><div class="lb">规则分布</div><div class="val" style="font-size:15px;line-height:2.2">${logChips}</div></div>
      <div class="stat"><div class="lb">防狼过滤</div><div class="val ${b.filters.macd_below_zero_block ? 'up' : ''}">${b.filters.macd_below_zero_block ? '开启' : '关闭'}</div><div class="sub">MACD零轴下方一律禁买并扣25分</div></div>
    </div>
    <div class="grid g2 mt14">
      <div class="card"><h3><span class="dot"></span>四大规则当前参数</h3>
        <table><tr><th>规则</th><th>参数</th><th class="num">权重</th><th class="num">种子胜率</th></tr>${ruleRows}</table>
        <div class="hint">三种风格: 短线(止损-3%/止盈+8%/持5天) · 波段(-5%/+8%/20天) · ETF(-4%/+10%/30天)。到期或破位即关闭信号。</div>
      </div>
      <div class="card"><h3><span class="dot" style="background:var(--accent)"></span>行业胜率种子(回测)</h3>
        ${seeds.map(([g, v]) => `<div class="seed-row"><span>${esc(g)}</span><div class="seed-bar"><i style="width:${v*100*2}%"></i></div><span class="p-up">${(v*100).toFixed(1)}%</span></div>`).join('')}
        <div class="hint">个股评分时按所属组加成(seed×40分)。周五复盘后用真实数据覆盖种子值。</div>
      </div>
    </div>
    <div class="grid g2 mt14">
      <div class="card"><h3><span class="dot" style="background:var(--blue)"></span>最近信号日志(学习素材)</h3>
        <div class="tbl-wrap" style="max-height:320px"><table><tr><th>日期</th><th>名称</th><th>规则</th><th class="num">分</th><th class="num">价</th><th class="num">止损</th><th class="num">目标</th><th>状态</th></tr>${recentRows || '<tr><td colspan="8" style="color:var(--faint)">暂无</td></tr>'}</table></div>
      </div>
      <div class="card"><h3><span class="dot" style="background:var(--down)"></span>学习笔记(每周五更新)</h3>
        <div class="md-box">${esc(b.learnings)}</div>
        <div class="hint">文件: <code class="k">signals/learnings.md</code> · 记录规则命中/漏选复盘与参数调整决策</div>
      </div>
    </div>`;
}
