<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抖音财经情报看板</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { font-family:"Microsoft YaHei","微软雅黑",sans-serif; background:#f4f6f8; color:#1f2933; font-size:15px; }
  .wrap { max-width:1000px; margin:0 auto; padding:18px 16px 40px; }
  header { display:flex; justify-content:space-between; align-items:baseline; flex-wrap:wrap; margin-bottom:14px; }
  h1 { font-size:22px; color:#0b5cad; }
  .meta { font-size:12px; color:#7b8794; }
  .tabs { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
  .tab { padding:8px 18px; background:#fff; border:1px solid #d5dde5; border-radius:20px; cursor:pointer; font-size:14px; color:#52606d; }
  .tab.on { background:#0b5cad; color:#fff; border-color:#0b5cad; }
  .card { background:#fff; border-radius:10px; padding:18px 20px; box-shadow:0 1px 4px rgba(16,35,61,.08); margin-bottom:14px; }
  /* markdown 渲染样式 */
  .md h1 { font-size:19px; margin:10px 0 12px; color:#0b5cad; }
  .md h2 { font-size:17px; margin:18px 0 8px; color:#12395f; border-left:4px solid #0b5cad; padding-left:8px; }
  .md h3 { font-size:15px; margin:14px 0 6px; color:#1f2933; }
  .md p { margin:8px 0; line-height:1.75; }
  .md ul, .md ol { margin:8px 0 8px 22px; line-height:1.8; }
  .md li { margin:3px 0; }
  .md blockquote { border-left:4px solid #f0a020; background:#fffaf0; padding:8px 12px; margin:10px 0; border-radius:0 6px 6px 0; line-height:1.7; }
  .md hr { border:none; border-top:1px dashed #cbd2d9; margin:14px 0; }
  .md strong { color:#c2410c; }
  .md code { background:#eef2f5; padding:1px 5px; border-radius:4px; font-size:13px; }
  .md table { border-collapse:collapse; margin:10px 0; width:100%; font-size:13.5px; }
  .md th, .md td { border:1px solid #d5dde5; padding:6px 10px; text-align:left; line-height:1.5; }
  .md th { background:#eaf2fa; color:#0b5cad; }
  .md tr:nth-child(even) td { background:#f7fafc; }
  /* 视频列表 */
  .vrow { border-bottom:1px solid #eef2f5; padding:10px 6px; cursor:pointer; }
  .vrow:hover { background:#f7fafc; }
  .vhead { display:flex; justify-content:space-between; gap:10px; flex-wrap:wrap; }
  .vacct { font-weight:bold; color:#0b5cad; }
  .vtitle { color:#1f2933; }
  .vmeta { font-size:12px; color:#7b8794; }
  .vtext { display:none; margin-top:10px; background:#f7fafc; border-radius:8px; padding:12px 14px; line-height:1.8; white-space:pre-wrap; font-size:14px; }
  .vrow.open .vtext { display:block; }
  .tag { display:inline-block; font-size:11px; background:#eaf2fa; color:#0b5cad; border-radius:10px; padding:1px 8px; margin-right:6px; }
  .empty { text-align:center; color:#7b8794; padding:40px 0; }
  .foot { text-align:center; font-size:12px; color:#9aa5b1; margin-top:10px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>📊 抖音财经情报看板</h1>
    <div class="meta" id="meta"></div>
  </header>
  <div class="tabs">
    <div class="tab on" data-t="info">今日信息点</div>
    <div class="tab" data-t="methods">方法论库</div>
    <div class="tab" data-t="videos">转写原文</div>
  </div>
  <div class="card md" id="panel"></div>
  <div class="foot">每天 08:40 / 17:30 自动更新 ｜ 仅供复盘参考，不构成投资建议</div>
</div>
<script src="dy_board_data.js"></script>
<script>
(function(){
  var D = window.DY_DATA || {};
  function esc(s){ return (s||"").replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;"); }
  // 简易 markdown 渲染（支持标题/表格/列表/粗体/引用/分隔线）
  function md(src){
    var lines=(src||"").split(/\r?\n/), out=[], i=0, buf=[], inUl=false, inOl=false, inQ=false;
    function flush(){ if(buf.length){ if(inUl){out.push("<ul>"+buf.join("")+"</ul>");} else if(inOl){out.push("<ol>"+buf.join("")+"</ol>");} else if(inQ){out.push("<blockquote>"+buf.join("<br>")+"</blockquote>");} buf=[]; inUl=inOl=inQ=false; } }
    function inline(t){ t=esc(t);
      t=t.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
      t=t.replace(/`([^`]+)`/g,"<code>$1</code>");
      t=t.replace(/【([^】]+)】/g,"<strong>【$1】</strong>");
      return t; }
    while(i<lines.length){
      var L=lines[i];
      if(/^\s*\|/.test(L)){ flush(); var rows=[]; while(i<lines.length&&/^\s*\|/.test(lines[i])){ rows.push(lines[i]); i++; }
        var html="<table>", cells=rows.map(function(r){ return r.split("|").slice(1,-1).map(function(c){return c.trim();}); });
        if(cells.length){ var sep=1; if(rows[1]&&/^[\s|:-]+$/.test(rows[1])) sep=2;
          html+="<tr>"+cells[0].map(function(c){return "<th>"+inline(c)+"</th>";}).join("")+"</tr>";
          for(var k=sep;k<cells.length;k++){ html+="<tr>"+cells[k].map(function(c){return "<td>"+inline(c)+"</td>";}).join("")+"</tr>"; }
        } html+="</table>"; out.push(html); continue; }
      var m;
      if(m=L.match(/^(#{1,4})\s+(.*)$/)){ flush(); var h=Math.min(m[1].length+1,5); out.push("<h"+h+">"+inline(m[2])+"</h"+h+">"); }
      else if(/^\s*---+\s*$/.test(L)){ flush(); out.push("<hr>"); }
      else if(m=L.match(/^\s*[-*]\s+(.*)$/)){ if(inQ||inOl)flush(); if(!inUl){flush();inUl=true;} buf.push("<li>"+inline(m[1])+"</li>"); }
      else if(m=L.match(/^\s*\d+[.、]\s+(.*)$/)){ if(inQ||inUl)flush(); if(!inOl){flush();inOl=true;} buf.push("<li>"+inline(m[1])+"</li>"); }
      else if(m=L.match(/^>\s?(.*)$/)){ if(inUl||inOl)flush(); if(!inQ){flush();inQ=true;} buf.push(inline(m[1])); }
      else if(/^\s*$/.test(L)){ flush(); }
      else { flush(); out.push("<p>"+inline(L)+"</p>"); }
      i++;
    }
    flush(); return out.join("\n");
  }
  function renderInfo(){
    document.getElementById("panel").className="card md";
    document.getElementById("panel").innerHTML="<h2>📅 "+esc(D.infoDate||"—")+" 信息点</h2>"+md(D.infoMd);
  }
  function renderMethods(){
    document.getElementById("panel").className="card md";
    document.getElementById("panel").innerHTML=md(D.methodsMd);
  }
  function renderVideos(){
    document.getElementById("panel").className="card";
    var v=D.videos||[], h="";
    if(!v.length){ h='<div class="empty">暂无转写数据</div>'; }
    else{
      h='<div style="font-size:12.5px;color:#7b8794;margin-bottom:8px">点击任意一条展开完整口播文字（'+v.length+' 条，按发布时间倒序）</div>';
      for(var i=0;i<v.length;i++){
        var r=v[i];
        h+='<div class="vrow" data-i="'+i+'"><div class="vhead"><span class="vacct">'+esc(r.account)+'</span>'+
           '<span class="vtitle">'+esc(r.desc)+'</span></div>'+
           '<div class="vmeta"><span class="tag">'+esc(r.ct)+'</span>赞'+r.digg+' 评'+r.cmt+' 时长'+r.dur+'s '+r.chars+'字</div>'+
           '<div class="vtext">'+esc(r.text)+'</div></div>';
      }
    }
    document.getElementById("panel").innerHTML=h;
    document.getElementById("panel").addEventListener("click",function(e){
      var row=e.target.closest(".vrow"); if(row){ row.classList.toggle("open"); }
    });
  }
  document.querySelector(".tabs").addEventListener("click",function(e){
    var t=e.target.closest(".tab"); if(!t)return;
    document.querySelectorAll(".tab").forEach(function(x){x.classList.remove("on");});
    t.classList.add("on");
    var k=t.getAttribute("data-t");
    document.getElementById("panel").removeAttribute("style");
    if(k==="info")renderInfo(); else if(k==="methods")renderMethods(); else renderVideos();
  });
  document.getElementById("meta").textContent="数据更新："+(D.updated||"—");
  renderInfo();
})();
</script>
</body>
</html>
